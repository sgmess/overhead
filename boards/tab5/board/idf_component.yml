dependencies:
  idf: ">=5.5"
  # Detects all three panel revisions at boot: ILI9881C + GT911,
  # ST7123 (Oct 2025) and ST7121 (Apr 2026). The variant without the BSP's
  # own LVGL layer (esp_lvgl_port): the display goes through the adapter.
  espressif/m5stack_tab5_noglib:
    version: "1.3.2"
    public: true
  # The display through esp_lvgl_adapter, as on the 3.4C, not the BSP's
  # esp_lvgl_port: it rotates for landscape far faster (main/ui bench:
  # esp_lvgl_port managed 12 fps scrolling the settings, rotating each
  # 24-line strip and copying it in turn)
  # 0.7 builds against LVGL 9.6's headers without warnings, and fixes races
  # in the tear-avoiding modes; the 3.4C's BSP still pins 0.6.
  espressif/esp_lvgl_adapter:
    version: "~0.7"
    public: true
  # WiFi through the ESP32-C6 over SDIO. The host side must match the
  # esp_hosted major version on the C6: this Tab5's C6 was updated to 2.12.6
  # (2026-10-06), and the 1.4 host then asserted in netif_add on connect.
  espressif/esp_wifi_remote:
    version: "1.6.*"
  espressif/esp_hosted:
    version: "2.12.*"
    public: true # net.c logs the co-processor's firmware version
