dependencies:
  idf: ">=5.5"
  waveshare/esp32_p4_wifi6_touch_lcd_xc:
    version: "3.0.1"
    public: true
  # WiFi through the ESP32-C6 over SDIO. The host side must match the
  # esp_hosted major version on the C6, which was updated to 2.x (October
  # 2026); 1.4's esp_wifi_remote (0.14) also has no IDF 6.1 support.
  espressif/esp_wifi_remote:
    version: "1.6.*"
  espressif/esp_hosted:
    version: "2.12.*"
    public: true # net.c logs the co-processor's firmware version
