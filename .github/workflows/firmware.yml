name: Firmware

# Every push to main builds the firmware, so a broken build shows up at once.
# Pushing a version tag also publishes it:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# - a GitHub release with, per board, overhead-<board>-full.bin (the whole
#   flash image, for the web flasher or esptool at 0x0) and
#   overhead-<board>-ota.bin (the app, which the configuration page's
#   "Check for updates" installs over WiFi)
# - the web flasher on GitHub Pages, serving that release's full images
#
# One-time setup: Settings > Pages > Source = "GitHub Actions".
#
# Builds start from sdkconfig.defaults*, never a local sdkconfig, so release
# images carry no WiFi network: they open the setup portal on first boot.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The P4 3.4C (p4_34c, esp32p4) and S3 2.8C (s3_28c, esp32s3) are
          # parked; add them back here
          - board: tab5
            target: esp32p4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the version git describe stamps into the app

      - name: Build and merge
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: ${{ matrix.target }}
          command: >-
            idf.py -B build_${{ matrix.board }} -D OVERHEAD_BOARD=${{ matrix.board }} build &&
            idf.py -B build_${{ matrix.board }} merge-bin -o overhead-${{ matrix.board }}-full.bin &&
            python -m esp_idf_size --format json2 build_${{ matrix.board }}/overhead-${{ matrix.board }}.map > size.json

      # On the Tab5, esp_hosted's start-up allocations take most of the
      # internal RAM that static data leaves, before the scheduler starts.
      # With its 20-deep SDIO queues, v0.1.1 (122,222 bytes of static D/IRAM)
      # booted and v0.2.0/v0.2.1 (132,090) asserted creating the timer task,
      # in a boot loop. At 12 deep it takes about 26 KB less; v0.2.4 (132,880
      # with XIP) has 302 KB free at app_main against v0.2.2's 287. The budget
      # keeps about half that gain in hand. Anything past it needs testing on
      # a Tab5 before it is released: move big buffers to PSRAM rather than
      # raise it.
      - name: Check static internal RAM
        if: matrix.board == 'tab5'
        run: |
          # json2: the format both 5.5's and 6.1's esp_idf_size accept
          used=$(python3 -c "import json; print(next(m['used'] for m in json.load(open('size.json'))['layout'] if m['name'] == 'DIRAM'))")
          budget=140000
          echo "static D/IRAM: $used bytes (budget $budget)"
          if [ "$used" -gt "$budget" ]; then
            echo "::error::Static internal RAM is $used bytes, over the Tab5's $budget-byte budget; it may not boot"
            exit 1
          fi

      - name: Collect images
        run: |
          mkdir -p out
          b=build_${{ matrix.board }}
          cp "$b/overhead-${{ matrix.board }}-full.bin" out/
          cp "$b/overhead-${{ matrix.board }}.bin" "out/overhead-${{ matrix.board }}-ota.bin"
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: out

      - uses: softprops/action-gh-release@v3
        with:
          files: out/*.bin
          generate_release_notes: true
          body: |
            **Over WiFi:** on the configuration page (`http://overhead.local`), *Firmware > Check for updates* installs this release.

            **First install, from a browser:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ (Chrome or Edge on a computer, with the board on USB).

            **With esptool:** `esptool.py --chip esp32p4 write_flash 0x0 overhead-tab5-full.bin`

            | File | What it is |
            | --- | --- |
            | `overhead-tab5-full.bin` | M5Stack Tab5, the whole flash image (at `0x0`) |
            | `overhead-tab5-ota.bin` | M5Stack Tab5, the app alone, for updates over WiFi |

            The Tab5 build expects esp_hosted 2.12 on the board's ESP32-C6.

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: out

      - name: Assemble the flasher
        run: |
          mkdir -p site
          cp web/flash/* site/
          cp out/*-full.bin site/
          # The flasher shows, and esp-web-tools reports, the release's version
          sed -i "s/__VERSION__/${GITHUB_REF_NAME}/g" site/*.html site/*.json
          ls -l site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
